databases:
  - name: edustimul-db
    plan: free
    databaseName: edustimul
    user: edustimul

services:
  - type: web
    name: edustimul
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edustimul-db
          property: connectionString
